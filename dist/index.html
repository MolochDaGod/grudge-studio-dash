<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grudge Studio · Harbor Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://js.puter.com/v2/"></script>
<style>
:root{
  --void:#050810; --abyss:#081421; --deep:#0d1f33; --shallow:#16314d; --foam:#2a4d70;
  --ink:#e8e1d0; --ink-dim:#8a8377; --ink-faint:#4a4538;
  --gold:#c9a961; --gold-bright:#e8c878; --gold-deep:#8b7339; --bone:#d4c8a8;
  --blood:#c41230; --teal:#4a8a82;
  --green:#4ade80; --warn:#f59e0b; --down:#ef4444;
  --border:#2a2438; --border-l:#3a3148;
  --serif:'Cinzel',serif; --italic:'Cormorant Garamond',serif; --mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--ink);font-family:var(--mono);overflow:hidden}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold-bright)}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:var(--void)}
::-webkit-scrollbar-thumb{background:var(--border)}
::-webkit-scrollbar-thumb:hover{background:var(--gold-deep)}

/* ───── TOP BAR ───── */
.tbar{height:54px;background:linear-gradient(180deg,rgba(5,8,16,.96),rgba(5,8,16,.7));
  backdrop-filter:blur(14px);border-bottom:1px solid rgba(201,169,97,.22);
  display:flex;align-items:center;padding:0 18px;gap:16px;flex-shrink:0;z-index:50;
  box-shadow:0 8px 32px rgba(0,0,0,.45)}
.tbar .compass{width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;
  background:radial-gradient(circle,var(--abyss) 30%,var(--void));position:relative;display:grid;place-items:center;flex-shrink:0}
.tbar .compass::before{content:'';position:absolute;inset:4px;border:1px dashed rgba(201,169,97,.5);border-radius:50%}
.tbar .compass svg{position:absolute;inset:0;animation:rot 60s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand h1{font-family:var(--serif);font-weight:700;font-size:13px;letter-spacing:.32em;color:var(--bone)}
.brand small{font-size:9px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-top:2px}
.tbar .sep{width:1px;height:28px;background:var(--border)}
.tbadge{padding:5px 11px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  border:1px solid var(--border);color:var(--ink-dim);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.tbadge.ok{color:var(--green);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08);
  box-shadow:inset 0 0 0 1px rgba(74,222,128,.1)}
.tbadge.warn{color:var(--warn);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.tbadge.crit{color:var(--down);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.55}}
.tbar-r{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink-dim);font-size:11px;letter-spacing:.1em}
.clock{font-family:var(--mono);color:var(--gold);letter-spacing:.15em}
.tbtn{padding:6px 13px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  border:1px solid var(--border);color:var(--ink-dim);background:rgba(13,31,51,.6);transition:all .18s;cursor:pointer}
.tbtn:hover{border-color:var(--gold);color:var(--bone);background:rgba(201,169,97,.08)}
.tbtn.primary{border-color:var(--gold);color:var(--gold);background:rgba(201,169,97,.12)}
.tbtn.primary:hover{background:linear-gradient(180deg,var(--gold-deep),var(--gold));color:var(--void)}

/* ───── LAYOUT ───── */
.app{display:flex;height:calc(100% - 54px)}
.sb{width:64px;flex-shrink:0;background:linear-gradient(180deg,var(--abyss),var(--void));
  border-right:1px solid rgba(201,169,97,.18);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;z-index:40}
.sb-btn{width:48px;height:44px;display:grid;place-items:center;color:var(--ink-faint);
  border-left:2px solid transparent;font-size:18px;transition:all .18s;position:relative}
.sb-btn:hover{color:var(--bone);background:rgba(201,169,97,.06)}
.sb-btn.active{color:var(--gold);border-left-color:var(--gold);background:rgba(201,169,97,.1);
  box-shadow:inset 0 0 16px rgba(201,169,97,.06)}
.sb-btn .sb-tip{position:absolute;left:54px;background:var(--abyss);border:1px solid var(--gold);
  color:var(--bone);font-family:var(--serif);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  padding:5px 12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:60}
.sb-btn:hover .sb-tip{opacity:1}
.sb-spacer{flex:1}

.main{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(ellipse at 25% 20%,rgba(201,169,97,.04) 0%,transparent 55%),
  radial-gradient(ellipse at 75% 80%,rgba(196,18,48,.03) 0%,transparent 55%),
  linear-gradient(180deg,var(--void) 0%,var(--abyss) 50%,var(--deep) 100%)}
.main::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(201,169,97,.04) 1px,transparent 1px),
  linear-gradient(90deg,rgba(201,169,97,.04) 1px,transparent 1px);background-size:80px 80px}
.main::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.04;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' seed='5'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E")}

/* ───── PAGE HEADER (per-tab) ───── */
.ph{padding:20px 28px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(8,20,33,.5),transparent);
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;position:relative;z-index:5}
.ph h2{font-family:var(--serif);font-size:18px;letter-spacing:.18em;color:var(--bone);text-transform:uppercase;margin-bottom:5px}
.ph p{font-family:var(--italic);font-style:italic;color:var(--ink-dim);font-size:14px;line-height:1.5;max-width:680px}
.ph-r{display:flex;gap:8px;flex-shrink:0}

/* ───── MAP TAB ───── */
.stage{flex:1;overflow:auto;position:relative;cursor:grab}
.stage.drag{cursor:grabbing}
.canvas{position:relative;width:2700px;height:1500px;transform-origin:0 0;transition:transform .08s ease-out}
.canvas.no-tx{transition:none}
.connSvg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.conn{fill:none;stroke-width:1.5;opacity:.4;transition:opacity .25s,stroke-width .25s}
.conn-glow{fill:none;stroke-width:6;opacity:.06;filter:blur(2px)}
.conn.active{stroke:var(--green);stroke-dasharray:8 12;animation:flow 4s linear infinite}
.conn.degraded{stroke:var(--warn);stroke-dasharray:6 4;animation:flow 6s linear infinite}
.conn.broken{stroke:var(--down);stroke-dasharray:3 5;opacity:.65}
.conn.unverified{stroke:var(--gold);stroke-dasharray:2 8;opacity:.4;animation:flow 8s linear infinite}
.conn.hl{opacity:1!important;stroke-width:2.6}
.conn-glow.active{stroke:var(--green)}.conn-glow.degraded{stroke:var(--warn)}.conn-glow.broken{stroke:var(--down)}.conn-glow.unverified{stroke:var(--gold)}
@keyframes flow{to{stroke-dashoffset:-200}}

.region{position:absolute;pointer-events:none;z-index:0}
.region-bg{position:absolute;border:1px dashed rgba(201,169,97,.18);
  background:radial-gradient(ellipse at center,rgba(201,169,97,.03) 0%,transparent 75%)}
.region-lab{position:absolute;font-family:var(--serif);font-size:13px;letter-spacing:.5em;color:rgba(201,169,97,.55);
  text-transform:uppercase;white-space:nowrap;text-shadow:0 0 12px rgba(0,0,0,.6)}
.region-lab small{display:block;font-family:var(--italic);font-style:italic;font-size:13px;letter-spacing:.12em;
  color:rgba(138,131,119,.65);margin-top:4px}

.vessel{position:absolute;cursor:pointer;transform:translate(-50%,-50%);z-index:2;transition:filter .25s}
.vessel:hover{z-index:5;filter:drop-shadow(0 0 14px var(--gold))}
.vessel.sel{z-index:6;filter:drop-shadow(0 0 22px var(--gold-bright))}
.vessel.muted{opacity:.22}
.vessel svg{display:block;overflow:visible}
.vlabel{position:absolute;top:100%;left:50%;transform:translate(-50%,6px);font-family:var(--serif);font-size:9px;
  letter-spacing:.18em;color:var(--bone);text-transform:uppercase;white-space:nowrap;pointer-events:none;font-weight:500;
  text-shadow:0 0 4px var(--void),0 1px 2px var(--void),0 0 8px var(--void)}
.vdot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--void);z-index:3}
.vdot.online{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2.4s infinite}
.vdot.offline{background:var(--down);box-shadow:0 0 10px var(--down);animation:pulse 1.2s infinite}
.vdot.unknown{background:var(--ink-dim)}
@keyframes sway{0%,100%{transform:translate(-50%,-50%) translateY(0) rotate(0)}
  50%{transform:translate(-50%,-50%) translateY(-3px) rotate(.3deg)}}
.vessel.swaying{animation:sway 7s ease-in-out infinite}

.zoompad{position:absolute;bottom:18px;right:18px;display:flex;background:rgba(8,20,33,.88);
  backdrop-filter:blur(8px);border:1px solid rgba(201,169,97,.22);z-index:10}
.zoompad button{width:32px;height:32px;color:var(--bone);font-size:14px;border-right:1px solid var(--border)}
.zoompad button:last-child{border-right:none}
.zoompad button:hover{color:var(--gold);background:rgba(201,169,97,.1)}
.zoompad .zd{display:grid;place-items:center;padding:0 12px;font-size:10px;color:var(--gold);border-right:1px solid var(--border)}

.legend{position:absolute;bottom:18px;left:18px;background:rgba(8,20,33,.88);
  backdrop-filter:blur(8px);border:1px solid rgba(201,169,97,.22);padding:11px 13px;z-index:10;max-width:240px;font-size:10px}
.legend h4{font-family:var(--serif);font-size:9px;letter-spacing:.4em;color:var(--gold);margin-bottom:8px;text-transform:uppercase}
.lrow{display:flex;align-items:center;gap:7px;color:var(--ink-dim);margin-bottom:4px}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ldot.online{background:var(--green);box-shadow:0 0 4px var(--green)}.ldot.offline{background:var(--down)}.ldot.unknown{background:var(--ink-dim)}
.lline{width:24px;height:2px;flex-shrink:0}.lline.active{background:var(--green)}.lline.degraded{background:var(--warn)}
.lline.broken{background:repeating-linear-gradient(90deg,var(--down) 0 3px,transparent 3px 6px)}
.lline.unverified{background:repeating-linear-gradient(90deg,var(--gold) 0 2px,transparent 2px 8px)}

/* ───── DASHBOARD CONTENT (Command/Network/etc) ───── */
.body{flex:1;overflow-y:auto;padding:20px 28px;position:relative;z-index:5}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{padding:14px 16px;background:rgba(13,31,51,.45);border:1px solid var(--border);
  border-left:3px solid var(--gold-deep);transition:all .2s}
.tile:hover{background:rgba(13,31,51,.7);border-left-color:var(--gold)}
.tile-l{font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
.tile-v{font-family:var(--serif);font-size:30px;color:var(--bone);font-weight:700;line-height:1}
.tile-s{font-size:10px;color:var(--ink-dim);margin-top:5px;font-style:italic;font-family:var(--italic);font-size:12px}
.tile.g{border-left-color:var(--green)}.tile.g .tile-v{color:var(--green)}
.tile.y{border-left-color:var(--warn)}.tile.y .tile-v{color:var(--warn)}
.tile.r{border-left-color:var(--down)}.tile.r .tile-v{color:var(--down)}
.tile.b{border-left-color:var(--teal)}.tile.b .tile-v{color:var(--teal)}
.tile.o{border-left-color:var(--gold-bright)}.tile.o .tile-v{color:var(--gold-bright)}
.tile.c{border-left-color:var(--gold)}.tile.c .tile-v{color:var(--gold)}

.grid-3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
@media (max-width:1280px){.grid-3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.grid-3{grid-template-columns:1fr}}

.card{background:rgba(13,31,51,.4);border:1px solid var(--border);margin-bottom:14px}
.card-h{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(8,20,33,.6),transparent)}
.card-h h3{font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.card-h .csub{font-size:10px;color:var(--ink-dim)}
.card-b{padding:14px 16px}
.card-b.flush{padding:0}

.empty{padding:36px 20px;text-align:center}
.empty-i{font-size:34px;color:var(--ink-faint);margin-bottom:10px}
.empty p{color:var(--ink-dim);font-family:var(--italic);font-style:italic;font-size:13px}

.issue{padding:11px 16px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.issue:last-child{border-bottom:none}
.issue:hover{background:rgba(201,169,97,.04)}
.issue-d{width:10px;height:10px;border-radius:50%}
.issue-d.down{background:var(--down);box-shadow:0 0 6px var(--down)}
.issue-d.warn{background:var(--warn)}
.issue-n{color:var(--bone);font-size:12px}
.issue-n small{color:var(--ink-dim);font-style:italic;font-family:var(--italic);font-size:12px;margin-left:8px}
.issue-a{display:flex;gap:5px}
.iact{padding:3px 9px;font-size:9px;letter-spacing:.18em;border:1px solid var(--border);color:var(--ink-dim);text-transform:uppercase;background:rgba(8,20,33,.5)}
.iact:hover{border-color:var(--gold);color:var(--gold)}
.iact.danger:hover{border-color:var(--down);color:var(--down)}

.evlist{padding:0}
.ev{padding:7px 16px;border-bottom:1px solid rgba(42,36,56,.4);display:grid;grid-template-columns:80px 60px 1fr;gap:10px;align-items:center;font-size:11px;cursor:pointer}
.ev:hover{background:rgba(201,169,97,.04)}
.ev .ets{color:var(--ink-faint);font-family:var(--mono);font-size:10px}
.ev .elv{font-weight:600;text-transform:uppercase;font-size:9px;letter-spacing:.18em}
.ev .elv.info{color:var(--bone)}.ev .elv.warn{color:var(--warn)}.ev .elv.error,.ev .elv.fatal{color:var(--down)}.ev .elv.debug{color:var(--ink-dim)}
.ev .em{color:var(--ink)}.ev .em b{color:var(--gold);font-weight:500;font-family:var(--mono);font-size:10px;margin-right:6px}

/* ───── NETWORK TAB ───── */
.netreg{margin-bottom:22px}
.netreg h4{font-family:var(--serif);font-size:11px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;
  padding-bottom:6px;border-bottom:1px solid var(--border)}
.netreg h4 .rsub{font-family:var(--italic);font-style:italic;color:var(--ink-dim);font-size:12px;letter-spacing:.05em;margin-left:10px}
.netgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.nv{padding:10px 12px;background:rgba(13,31,51,.4);border:1px solid var(--border);border-left:3px solid var(--ink-faint);transition:all .15s;cursor:pointer}
.nv:hover{background:rgba(201,169,97,.06);border-left-color:var(--gold);transform:translateX(2px)}
.nv.online{border-left-color:var(--green)}
.nv.offline{border-left-color:var(--down)}
.nv-n{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-size:10px;letter-spacing:.18em;color:var(--bone);text-transform:uppercase}
.nv-d{font-size:10px;color:var(--ink-dim);margin-top:4px;font-style:italic;font-family:var(--italic);font-size:12px}
.nv-m{font-size:9px;color:var(--ink-faint);margin-top:6px;letter-spacing:.05em}
.nv-m b{color:var(--gold);font-weight:500}

/* ───── ACCOUNTS TAB ───── */
.acct-row{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px}
.acct-row:last-child{border-bottom:none}
.acct-row span:first-child{color:var(--ink-dim);letter-spacing:.05em}
.acct-row span:last-child{color:var(--bone);font-family:var(--mono);font-size:11px}
.input{padding:8px 12px;background:rgba(8,20,33,.7);border:1px solid var(--border);color:var(--ink);font-family:inherit;font-size:12px;width:100%}
.input:focus{outline:none;border-color:var(--gold)}

/* ───── LOGS TAB ───── */
.logfilters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.lf{padding:5px 10px;font-size:10px;letter-spacing:.15em;border:1px solid var(--border);color:var(--ink-dim);text-transform:uppercase;cursor:pointer}
.lf.active{border-color:var(--gold);color:var(--gold);background:rgba(201,169,97,.1)}
.lf:hover{color:var(--bone)}

/* ───── RELAYS TAB ───── */
.relay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.relay-card{padding:11px 13px;background:rgba(13,31,51,.4);border:1px solid var(--border);border-left:3px solid;font-size:11px}
.relay-card.active{border-left-color:var(--green)}
.relay-card.degraded{border-left-color:var(--warn)}
.relay-card.broken{border-left-color:var(--down)}
.relay-card.unverified{border-left-color:var(--gold)}
.relay-pair{color:var(--bone);font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.relay-pair .arrow{color:var(--ink-faint)}
.relay-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.12em}
.relay-spark{display:flex;align-items:flex-end;height:24px;gap:1px;margin-bottom:6px}
.relay-spark-bar{flex:1;background:var(--gold);min-width:2px;opacity:.55;transition:height .3s}
.relay-spark-bar.hi{background:var(--down);opacity:1}
.relay-actions{display:flex;gap:5px;margin-top:6px}

/* ───── BRIDGE DRAWER (bottom) ───── */
.bridge{position:fixed;bottom:0;left:64px;right:0;height:280px;background:linear-gradient(180deg,var(--abyss),var(--void));
  border-top:1px solid rgba(201,169,97,.25);display:flex;flex-direction:column;z-index:55;
  transition:height .3s cubic-bezier(.4,0,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.bridge.collapsed{height:36px}
.bridge-bar{height:36px;background:rgba(8,20,33,.85);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;cursor:pointer}
.bridge-bar h3{font-family:var(--serif);font-size:10px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase}
.bridge-bar .bspacer{flex:1}
.bridge-bar .bclose{color:var(--ink-dim);padding:4px 8px}
.bridge-bar .bclose:hover{color:var(--gold)}
.bridge-body{flex:1;display:flex;overflow:hidden}
.bridge.collapsed .bridge-body{display:none}
.bridge-msgs{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.bmsg{max-width:88%;padding:8px 12px;font-size:12px;line-height:1.55;border-left:2px solid}
.bmsg.system{align-self:stretch;border-left-color:var(--gold-deep);background:rgba(201,169,97,.04);
  color:var(--ink-dim);font-family:var(--italic);font-style:italic;font-size:13px}
.bmsg.user{align-self:flex-end;border-left-color:var(--teal);background:rgba(74,138,130,.08);color:var(--bone)}
.bmsg.assistant{align-self:flex-start;border-left-color:var(--gold);background:rgba(201,169,97,.06);color:var(--ink);white-space:pre-wrap}
.bmsg .bauth{font-family:var(--serif);font-size:9px;letter-spacing:.32em;text-transform:uppercase;margin-bottom:5px;opacity:.7}
.bmsg.user .bauth{color:var(--teal)}.bmsg.assistant .bauth{color:var(--gold)}
.bridge-side{width:240px;border-left:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;background:rgba(8,20,33,.4)}
.bridge-side h5{font-family:var(--serif);font-size:9px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:5px}
.bchip{padding:6px 10px;background:rgba(201,169,97,.05);border:1px solid rgba(201,169,97,.18);

.bridge-input{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--abyss)}
.bridge-input textarea{flex:1;background:rgba(8,20,33,.7);border:1px solid var(--border);color:var(--ink);

.bridge-input textarea:focus{outline:none;border-color:var(--gold)}
.bridge-input .bsend{padding:0 18px;background:linear-gradient(180deg,var(--gold-deep),var(--gold));

  text-transform:uppercase;font-weight:700;transition:all .15s}
.bridge-input .bsend:hover{background:var(--gold-bright);box-shadow:0 0 12px rgba(201,169,97,.4)}
.bridge-input .bsend:disabled{opacity:.4;cursor:not-allowed}

/* ───── INSPECTOR (right slide-in) ───── */
.insp{position:fixed;top:54px;right:0;bottom:0;width:340px;background:linear-gradient(180deg,var(--abyss),var(--void));

.insp.open{transform:translateX(0)}

.insp-h .isub{font-family:var(--italic);font-style:italic;font-size:14px;color:var(--ink-dim);margin-top:3px}
.insp-h .iclose{position:absolute;top:14px;right:14px;color:var(--ink-dim);padding:6px;font-size:14px}
.insp-h .iclose:hover{color:var(--gold)}
.insp-s{padding:16px 22px;border-bottom:1px solid var(--border)}
.insp-s h4{font-family:var(--serif);font-size:10px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.irow{display:flex;justify-content:space-between;padding:6px 0;font-size:11px;border-bottom:1px solid rgba(42,36,56,.4);gap:10px}
.irow:last-child{border-bottom:none}
.irow .k{color:var(--ink-dim);letter-spacing:.05em;flex-shrink:0}
.irow .v{color:var(--bone);text-align:right;word-break:break-word;font-size:11px}
.irow .v.mono{font-family:var(--mono);color:var(--gold);font-size:10px}
.note{padding:10px 12px;background:rgba(196,18,48,.06);border-left:3px solid var(--blood);margin-top:8px}
.note h4{color:var(--blood);font-size:9px;letter-spacing:.32em}
.note p{font-family:var(--italic);font-style:italic;font-size:13px;color:var(--bone);line-height:1.5;margin-top:6px}
.note.ok{border-left-color:var(--green);background:rgba(74,222,128,.06)}
.note.ok h4{color:var(--green)}
.runbook{font-size:11px;line-height:1.65;color:var(--bone);white-space:pre-wrap;font-family:var(--mono)}
.relay-runbook{font-size:10px;line-height:1.55;color:var(--ink-dim);margin-top:8px;padding:8px 10px;border:1px solid var(--border);background:rgba(8,20,33,.5);white-space:pre-wrap}

/* Layout — auto-grid vessels within their region bounds */
function layoutVessels() {
  const byRegion = {};
  FLEET.forEach(v => (byRegion[v.region] = byRegion[v.region] || []).push(v));
  REGIONS.forEach(r => {
    const list = byRegion[r.id] || [];
    const cols = Math.ceil(Math.sqrt(list.length * (r.w / r.h))) || 1;
    const rows = Math.ceil(list.length / cols);
    const padX = 60, padY = 90;
    const cellW = (r.w - padX * 2) / cols;
    const cellH = (r.h - padY * 2) / rows;
    list.forEach((v, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      v.x = r.x + padX + cellW * col + cellW / 2;
      v.y = r.y + padY + cellH * row + cellH / 2;
    });
  });
}
layoutVessels();

function isFleetOperator(user) {
  if (!user) return false;
  const u = String(user.username || '').toLowerCase();
  const e = String(user.email || '').toLowerCase();
  return FLEET_OPERATORS.has(u) || FLEET_OPERATOR_EMAILS.has(e);
}

async function signInWithPuter() {
  showAuthErr('');
  try {
    if (typeof puter === 'undefined' || !puter.auth) {
      showAuthErr('Puter SDK not loaded — check js.puter.com');
      return;
    }
    let user;
    if (puter.auth.isSignedIn()) {
      user = await puter.auth.getUser();
    } else {
      const result = await puter.auth.signIn();
      if (result && result.success === false) throw result;
      user = await puter.auth.getUser();
    }
    if (!user?.username) {
      showAuthErr('Could not read your Puter account.');
      return;
    }
    if (!isFleetOperator(user)) {
      try { await puter.auth.signOut(); } catch {}
      showAuthErr(`Access denied — ${user.username} is not a fleet operator. Use grudachain or molochdadev.`);
      return;
    }
    state.puterUser = user;
    sessionStorage.setItem('gs_puter_operator', user.username);
    await exchangeGrudgeToken(user);
    showFleetConsole();
    render();
    renderBridge();
    pollHealth();
    startBridgeLiveStream();
    pollBridgeContext();
    loadIdentityStats();
  } catch (e) {
    const code = e?.error || e?.code;
    if (code === 'auth_window_closed') return;
    if (code === 'popup_blocked') showAuthErr('Allow popups for Puter sign-in.');
    else showAuthErr(e?.msg || e?.message || 'Puter sign-in failed');
  }
}

async function signOutPuter() {
  try { if (typeof puter !== 'undefined' && puter.auth) await puter.auth.signOut(); } catch {}
  state.puterUser = null;
  state.grudgeToken = null;
  state.grudgeUser = null;
  sessionStorage.removeItem('gs_puter_operator');
  sessionStorage.removeItem('gs_admin_key');
  sessionStorage.removeItem('gs_grudge_token');
  stopBridgeLiveStream();
  showAuthGate();
}

async function initPuterAuth() {
  $('puterSignIn')?.addEventListener('click', signInWithPuter);
  $('opPill')?.addEventListener('click', signOutPuter);
  try {
    if (typeof puter !== 'undefined' && puter.auth?.isSignedIn()) {
      const user = await puter.auth.getUser();
      if (isFleetOperator(user)) {
        state.puterUser = user;
        const savedTok = sessionStorage.getItem('gs_grudge_token');
        if (savedTok) state.grudgeToken = savedTok;
        showFleetConsole();
        return true;
      }
      try { await puter.auth.signOut(); } catch {}
    }
  } catch {}
  showAuthGate();
  return false;
}

  const puterId = puterUser?.uuid || puterUser?.id || puterUser?.username;
  if (!puterId) return;
  const endpoints = [`${GRUDGE_API}/auth/puter`, 'https://id.grudge-studio.com/auth/puter'];
  for (const url of endpoints) {
    try {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ puterId, displayName: puterUser.username }),
      });
      if (!r.ok) continue;
      const d = await r.json();
      const token = d.token || d.accessToken;
      if (!token) continue;
      state.grudgeToken = token;
      state.grudgeUser = d.user || d;
      sessionStorage.setItem('gs_grudge_token', token);
      pushEvent({ ts: Date.now(), level: 'info', source: 'auth', message: `Grudge session linked for ${puterUser.username}` });
      return;
    } catch {}
  }
}

/* ────────── HEALTH POLL ────────── */
async function pollHealth() {
  const checkable = FLEET.filter(v => v.healthUrl);
  const results = await Promise.allSettled(checkable.map(async v => {
    const t0 = performance.now();
    try {
      await fetch(v.healthUrl, { method:'HEAD', mode:'no-cors', cache:'no-store', signal: AbortSignal.timeout(8000) });
      return { id: v.id, status:'online', ms: Math.round(performance.now() - t0) };
    } catch { return { id: v.id, status:'offline', ms: null }; }
  }));
  let issues = 0;
  results.forEach(r => {
    if (r.status === 'fulfilled') {
      state.health[r.value.id] = r.value.status;
      state.healthLatency[r.value.id] = r.value.ms;
      if (r.value.status === 'offline') issues++;
      pushEvent({ ts: Date.now(), level: r.value.status === 'offline' ? 'error' : 'info', source: r.value.id, message: r.value.status === 'offline' ? 'health check failed' : `health ok (${r.value.ms}ms)` });
    }
  });
  FLEET.filter(v => v.tags && v.tags.includes('down')).forEach(v => state.health[v.id] = 'offline');
  FLEET.filter(v => !v.healthUrl && !state.health[v.id]).forEach(v => state.health[v.id] = 'unknown');
  updateBadges(issues);
  if (state.tab === 'map') renderVessels();
  else render();
}

function updateBadges(issues) {
  const b = $('statusBadge'), t = $('statusText');
  if (issues === 0) { b.className = 'tbadge ok'; t.textContent = 'All Operational'; }
  else if (issues < 3) { b.className = 'tbadge warn'; t.textContent = `${issues} Issue${issues>1?'s':''}`; }
  else { b.className = 'tbadge crit'; t.textContent = `${issues} Down`; }

  const bb = $('bridgeBadge');
  fetch(`${BRIDGE}/health`, { method:'GET', cache:'no-store', signal: AbortSignal.timeout(5000) })
    .then(() => { bb.className = 'tbadge ok'; bb.textContent = '● Bridge online'; })
    .catch(() => { bb.className = 'tbadge'; bb.textContent = '○ Bridge offline (demo)'; });

  const lb = $('liveBadge');
  if (lb) {
    if (state.liveConnected) { lb.className = 'tbadge ok'; lb.textContent = '● SSE live'; }
    else { lb.className = 'tbadge'; lb.textContent = '○ SSE off'; }
  }
}

function pushEvent(evt) {
  if (state.logFrozen) return;
  if (evt.id && state.eventIds.has(evt.id)) return;
  if (evt.id) state.eventIds.add(evt.id);
  state.events.unshift(evt);
  if (state.events.length > 500) state.events.length = 500;
}

function ingestObservatoryEvent(evt, rerender) {
  const before = state.events.length;
  pushEvent({
    id: evt.id,
    ts: typeof evt.ts === 'number' ? evt.ts : Date.parse(evt.ts) || Date.now(),
    level: evt.level || 'info',
    source: evt.source || 'observatory',
    message: evt.message || (evt.ai ? `AI ${evt.ai.provider}/${evt.ai.model} ${evt.ai.status}` : JSON.stringify(evt)),
  });
  if (rerender && state.events.length > before && state.tab === 'logs') render();
}

function parseSseBlock(block) {
  let eventType = 'message';
  let data = '';
  for (const line of block.split('\n')) {
    if (!line || line.startsWith(':')) continue;
    if (line.startsWith('event:')) eventType = line.slice(6).trim();
    else if (line.startsWith('data:')) data += (data ? '\n' : '') + line.slice(5).trim();
  }
  if (eventType !== 'event' || !data) return;
  try { ingestObservatoryEvent(JSON.parse(data), true); } catch {}
}

function stopBridgeLiveStream() {
  if (state.liveReconnectTimer) {
    clearTimeout(state.liveReconnectTimer);
    state.liveReconnectTimer = null;
  }
  if (state.liveStreamAbort) {
    state.liveStreamAbort.abort();
    state.liveStreamAbort = null;
  }
  state.liveConnected = false;
}

async function startBridgeLiveStream() {
  if (!state.puterUser) return;
  stopBridgeLiveStream();
  const ac = new AbortController();
  state.liveStreamAbort = ac;
  try {
    const r = await fetch(`${BRIDGE}/live`, {
      headers: operatorHeaders({ Accept: 'text/event-stream' }),
      cache: 'no-store',
      signal: ac.signal,
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    if (!r.body) throw new Error('No stream body');
    state.liveConnected = true;
    updateBadges(0);
    pushEvent({ ts: Date.now(), level: 'info', source: 'bridge-live', message: 'SSE stream connected' });
    if (state.tab === 'logs') render();
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop() || '';
      for (const block of parts) parseSseBlock(block);
    }
    throw new Error('stream ended');
  } catch (e) {
    if (e.name === 'AbortError') return;
    state.liveConnected = false;
    updateBadges(0);
    if (state.tab === 'logs') render();
    state.liveReconnectTimer = setTimeout(() => startBridgeLiveStream(), 5000);
  }
}

async function pollObservatory() {
  try {
    const r = await fetch(`${OBS}/v1/tail?limit=50`, { headers: operatorHeaders(), cache: 'no-store', signal: AbortSignal.timeout(8000) });
    if (!r.ok) return;
    const d = await r.json();
    let added = 0;
    for (const evt of (d.events || [])) {
      const before = state.events.length;
      ingestObservatoryEvent(evt, false);
      if (state.events.length > before) added++;
    }
    if (added && state.tab === 'logs') render();
  } catch {}
}

async function pollBridgeContext() {
  try {
    const r = await fetch(`${BRIDGE}/context`, { headers: operatorHeaders(), cache: 'no-store', signal: AbortSignal.timeout(8000) });
    if (!r.ok) return;
    state.bridgeContext = await r.json();
    if (state.tab === 'command') render();
  } catch {}
}

async function loadIdentityStats() {
  try {

    if (!r.ok) return;
    const d = await r.json();
    state.identityStats = d.stats || null;

  } catch {}
}

/* ────────── BRIDGE CHAT ────────── */
async function bridgeChat(question) {
  state.bridgeMsgs.push({role:'user', text: question});
  state.bridgeBusy = true;
  renderBridge();
  let reply;
  let usedFallback = false;
  try {
    const r = await fetch(`${BRIDGE}/chat`, {
      method:'POST',
      headers: operatorHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ messages: state.bridgeMsgs.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.text })) }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    reply = d.response || d.error || '(empty response)';
    if (d.fallback) {
      usedFallback = true;
      reply += '\n\n_(Bridge fallback — rotate ANTHROPIC_API_KEY on grudge-ai-debugger for live Claude)_';
    }
    pushEvent({ ts: Date.now(), level: usedFallback ? 'warn' : 'info', source: 'grudge-ai-debugger', message: `bridge chat ${usedFallback ? '(fallback)' : 'ok'}` });
  } catch (e) {
    usedFallback = true;
    reply = localBridgeReply(question) + `\n\n_(Network error: ${e.message || 'offline'} — using local runbooks)_`;
  }
  state.bridgeMsgs.push({role:'assistant', text: reply});
  state.bridgeBusy = false;
  renderBridge();
  pollObservatory();
}

function localBridgeReply(q) {
  const lc = q.toLowerCase();
  if (lc.includes('linux') || lc.includes('docker') || lc.includes('503') || lc.includes('5 down') || lc.includes('next 3')) {
    return `Top 3 highest-impact actions right now:\n\n1. Bring up the Linux VPS Docker stack (5 services 503 since March):\n   • SSH 74.208.155.229\n   • cd /opt/grudge && docker compose up -d\n   • Watch: docker compose logs -f --tail=100 game-api\n   • Most likely failure: missing DB_HOST/DB_USER env vars\n\n2. Add systemd persistence so a reboot doesn't kill the fleet (see docs/VPS-FIX.md).\n\n3. Wire grudge-ai-hub into observatory by dropping in observatory/src/client.ts and replacing console.log with obs.info(). Within 5 minutes /admin/sources lights up.`;
  }
  if (lc.includes('observatory') || lc.includes('wire') || lc.includes('ai hub')) {
    return `Wire each existing worker into grudge-observatory:\n\n1. Add binding OBSERVATORY_KEY in its wrangler.toml.\n2. wrangler secret put OBSERVATORY_KEY (use that worker's key from INGEST_KEYS).\n3. Drop in observatory/src/client.ts as observatory-client.ts.\n4. const obs = new Observatory({ endpoint: '/api/observatory', source: 'this-worker', key: env.OBSERVATORY_KEY, waitUntil: ctx.waitUntil.bind(ctx) });\n5. Replace console.log -> obs.info; AI calls -> obs.ai({...}); HTTP -> obs.http({...}).\n6. Deploy. /admin/sources lists it within 5 minutes.`;
  }
  if (lc.includes('colyseus') || lc.includes('windows')) {
    return RUNBOOKS.colyseus + '\n\nThen update grudge-game-servers:\n' + RUNBOOKS['grudge-game-servers'];
  }
  if (lc.includes('relay') || lc.includes('game-servers') || lc.includes('lobby')) {
    const broken = CONNECTIONS.filter(c => c.status === 'broken').map(c => `${c.from} → ${c.to}: ${RELAY_UPDATES[c.from+'→'+c.to] || c.label || c.status}`).join('\n');
    return `Relay status (${CONNECTIONS.length} total, ${CONNECTIONS.filter(c=>c.status==='broken').length} broken):\n\n${broken}\n\nOpen the Relays tab to inspect each link with runbook snippets.`;
  }
  if (lc.includes('retire') || lc.includes('audit') || lc.includes('legacy')) {
    return `Retirement candidates:\n\n• grudge-cdn (last touched 2026-04-04) — duplicate of grudge-asset-cdn.\n• grudgeproduction (2026-03-28) — purpose unclear.\n• ale (2026-03-24) — superseded by grudge-ai-hub (the new ALE).\n\nProcess per worker:\n1. wrangler download <name> — keep a local copy.\n2. Commit to /archive/workers/ in grudge-fleet.\n3. wrangler delete <name>.\n\nAll reversible from the archive.`;
  }
  return `Bridge is live at ${BRIDGE}. Try:\n• "Colyseus on Windows VPS" — full 8-step runbook\n• "relay status" — broken links + recommended updates\n• "next 3 actions" — Linux VPS + observatory + Colyseus priorities\n• Click any vessel on the map — inspector shows runbooks`;
}

      <ellipse cx="${cx}" cy="${cy+len*0.14}" rx="${wid*0.55}" ry="${len*0.06}" fill="none" stroke="${trim}" stroke-width=".6" opacity=".65"/>
      <circle cx="${cx}" cy="${cy}" r="3" fill="${c.acc}" opacity=".85"/></svg>`;
  }
  if (kind === 'lighthouse') {
    const r = u * 0.55;
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${wake}
      <circle cx="${cx}" cy="${cy}" r="${r*1.15}" fill="rgba(74,222,128,.06)"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${c.hull}" stroke="${trim}" stroke-width="1.1"/>
      <circle cx="${cx}" cy="${cy}" r="${r*0.7}" fill="${c.deck}" stroke="${trimD}" stroke-width=".6"/>
      <circle cx="${cx}" cy="${cy}" r="${r*0.32}" fill="${c.acc}" opacity=".95"><animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/></circle>
      <path d="M ${cx} ${cy} L ${cx+r*1.7} ${cy-r*0.4} L ${cx+r*1.7} ${cy+r*0.4} Z" fill="${c.acc}" opacity=".18"><animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="8s" repeatCount="indefinite"/></path>
    </svg>`;
  }
  return vesselSvg('frigate', size, status);
}

function bezierPath(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const o = Math.min(50, len * 0.18);
  return `M ${a.x} ${a.y} Q ${mx + (-dy/len)*o} ${my + (dx/len)*o} ${b.x} ${b.y}`;
}

function renderVessels() {
  const lookup = {}; FLEET.forEach(v => lookup[v.id] = v);
  // Connections
  const lines = CONNECTIONS.map(c => {
    const a = lookup[c.from], b = lookup[c.to];
    if (!a || !b) return '';
    const path = bezierPath(a, b);
    return `<path class="conn-glow ${c.status}" d="${path}"/><path class="conn ${c.status}" d="${path}" data-from="${c.from}" data-to="${c.to}"/>`;
  }).join('');
  $('connSvg').innerHTML = lines;
  // Regions
  $('regionLayer').innerHTML = REGIONS.map(r => `
    <div class="region">
      <div class="region-bg" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px"></div>
      <div class="region-lab" style="left:${r.x+18}px;top:${r.y+14}px">${r.label}<small>${r.sub}</small></div>
    </div>
  `).join('');
  // Vessels
  $('vesselLayer').innerHTML = FLEET.map((v, i) => {
    const status = state.health[v.id] || (v.tags && v.tags.includes('down') ? 'offline' : 'unknown');
    return `
      <div class="vessel swaying ${state.selected === v.id ? 'sel' : ''}" data-id="${v.id}" style="left:${v.x}px;top:${v.y}px;animation-delay:-${(i*0.13)%7}s">
        ${vesselSvg(v.kind, v.size, status)}
        <div class="vdot ${status}"></div>
        <div class="vlabel">${escapeHtml(v.name)}</div>
      </div>
    `;
  }).join('');
  $('vesselLayer').querySelectorAll('.vessel').forEach(el => {
    el.onclick = e => { e.stopPropagation(); selectVessel(el.dataset.id); };
  });
  applyMapTransform();
}

function applyMapTransform() {
  const c = $('canvas');
  if (!c) return;
  c.style.transform = `translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;
  if ($('zd')) $('zd').textContent = Math.round(state.zoom * 100) + '%';
}

function initMapInteractions() {
  const stage = $('stage'); if (!stage) return;
  let drag = false, sx = 0, sy = 0, spx = 0, spy = 0;
  stage.onmousedown = e => {
    if (e.target.closest('.vessel')) return;
    drag = true; stage.classList.add('drag');
    sx = e.clientX; sy = e.clientY; spx = state.panX; spy = state.panY;
    $('canvas').classList.add('no-tx');
  };
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    state.panX = spx + (e.clientX - sx);
    state.panY = spy + (e.clientY - sy);
    applyMapTransform();
  });
  window.addEventListener('mouseup', () => {
    drag = false; stage.classList.remove('drag');
    if ($('canvas')) $('canvas').classList.remove('no-tx');
  });
  stage.onclick = e => {
    if (e.target === stage || e.target.classList.contains('region-bg')) {
      state.selected = null; state.inspOpen = false;
      $('insp').classList.remove('open');
      renderVessels();
    }
  };
  stage.onwheel = e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const old = state.zoom;
    state.zoom = Math.max(0.2, Math.min(2.5, state.zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
    const ratio = state.zoom / old;
    state.panX = mx - (mx - state.panX) * ratio;
    state.panY = my - (my - state.panY) * ratio;
    applyMapTransform();
  };
  mapCenter();
}

function mapZoom(dir) { state.zoom = Math.max(0.2, Math.min(2.5, state.zoom * (dir > 0 ? 1.2 : 0.8))); applyMapTransform(); }
function mapCenter() {
  const stage = $('stage'); if (!stage) return;
  const r = stage.getBoundingClientRect();
  state.zoom = Math.min(r.width / 2700, r.height / 1500) * 0.95;
  state.panX = (r.width - 2700 * state.zoom) / 2;
  state.panY = (r.height - 1500 * state.zoom) / 2;
  applyMapTransform();
}

        ` : '<div class="card"><div class="card-b empty"><div class="empty-i">👤</div><p>No account selected. Search by grudge_id, email, username, discord_id, or wallet.</p></div></div>'}
      </div>
    </div>
  `;
}

async function lookupAccount() {
  const q = $('acctSearch')?.value?.trim();
  if (!q) return;
  state.acctLoading = true;
  state.selectedAcct = null;
  state.acctSource = null;
  render();
  try {
    const r = await fetch(`${IDENTITY_API}/account?q=${encodeURIComponent(q)}`, { headers: operatorHeaders(), cache: 'no-store' });
    if (r.ok) {
      const d = await r.json();
      state.selectedAcct = d.account || d;
      state.acctSource = 'grudge-identity-d1';
      pushEvent({ ts: Date.now(), level: 'info', source: 'grudge-identity', message: `account lookup: ${q}` });
    } else if (r.status === 404) {
      const listR = await fetch(`${GRUDGE_API}/admin/users?search=${encodeURIComponent(q)}&limit=1`, { headers: operatorHeaders() });
      if (listR.ok) {
        const list = await listR.json();
        const row = list.users?.[0];
        if (row) {
          const detailR = await fetch(`${GRUDGE_API}/admin/users/${row.id}`, { headers: operatorHeaders() });
          if (detailR.ok) {
            const full = await detailR.json();
            state.selectedAcct = { ...full.user, characters: full.characters, wallets: full.wallets, arenaStats: full.arenaStats, source: 'game-api' };
            state.acctSource = 'game-api (Postgres)';
          } else throw new Error(`Game API detail ${detailR.status}`);
        } else throw new Error('No account found in Grudge ID or game DB');
      } else throw new Error(r.status === 404 ? 'No account found in Grudge ID D1' : `Identity lookup failed (${r.status})`);
    } else {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || `Lookup failed (${r.status})`);
    }
  } catch (e) {
    state.selectedAcct = { error: e.message || 'Lookup failed', query: q };
    pushEvent({ ts: Date.now(), level: 'warn', source: 'accounts', message: `lookup failed: ${q} — ${e.message}` });
  }
  state.acctLoading = false;
  render();
}

/* ─────────────────────────────────────────────────────
   TAB: RELAYS
   ───────────────────────────────────────────────────── */
function renderRelays() {
  return `
    <div class="ph">
      <div><h2>Relays · Service-to-Service</h2><p>${CONNECTIONS.length} relays — ${CONNECTIONS.filter(c=>c.status==='active').length} active, ${CONNECTIONS.filter(c=>c.status==='broken').length} broken. Runbooks and recommended updates shown per link.</p></div>
    </div>
    <div class="body">
      <div class="relay-grid">
        ${CONNECTIONS.map(c => {
          const fromV = FLEET.find(v => v.id === c.from);
          const toV = FLEET.find(v => v.id === c.to);
          const seed = (c.from + c.to).split('').reduce((a, ch) => a + ch.charCodeAt(0), 0);
          const bars = Array.from({length: 30}, (_, i) => {
            const v = (Math.sin(seed + i * 0.7) + Math.cos(seed * 1.3 + i * 0.4) + 2) / 4;
            const hi = c.status === 'broken' && v > 0.6;
            return `<div class="relay-spark-bar ${hi?'hi':''}" style="height:${Math.max(15, v*100)}%"></div>`;
          }).join('');
          const rb = getRunbook(c.to) || getRunbook(c.from);
          const upd = RELAY_UPDATES[relayKey(c)];
          const rbSnippet = rb ? rb.split('\n').slice(0, 4).join('\n') + (rb.split('\n').length > 4 ? '\n…' : '') : '';
          return `
            <div class="relay-card ${c.status}">
              <div class="relay-pair">${fromV ? fromV.icon + ' ' + escapeHtml(fromV.name) : escapeHtml(c.from)}<span class="arrow">→</span>${toV ? toV.icon + ' ' + escapeHtml(toV.name) : escapeHtml(c.to)}</div>
              <div class="relay-meta"><span>${escapeHtml(c.label || '—')}</span><span>${c.status}</span></div>
              <div class="relay-spark">${bars}</div>
              ${upd ? `<div class="relay-update"><b>Best update:</b> ${escapeHtml(upd)}</div>` : ''}
              ${rbSnippet ? `<div class="relay-runbook">${escapeHtml(rbSnippet)}</div>` : ''}
              <div class="relay-actions">
                <button class="iact" onclick="selectVessel('${c.to}')">🔍 Inspect</button>
                <button class="iact" onclick="askBridge('Diagnose the ${c.status} relay from ${c.from} to ${c.to} (${c.label||''}). What is the best update?')">⚓ Bridge</button>
                <button class="iact" onclick="setTab('logs','${c.from}')">📜 Logs</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function saveAdminKey() {
  const v = $('adminKeyInput')?.value?.trim();
  if (v) sessionStorage.setItem('gs_admin_key', v);
  else sessionStorage.removeItem('gs_admin_key');
  loadDebugPanels();
  render();
}

async function loadDebugPanels() {
  if (!sessionStorage.getItem('gs_admin_key')) {
    state.obsSources = null;
    state.debugWorkers = null;
    return;
  }
  try {
    const [srcR, listR] = await Promise.all([
      fetch(`${OBS}/admin/sources`, { headers: operatorHeaders(), cache: 'no-store' }),
      fetch(`${BRIDGE}/code/list`, { headers: operatorHeaders(), cache: 'no-store' }),
    ]);
    state.obsSources = srcR.ok ? (await srcR.json()).sources : [{ error: `sources ${srcR.status}` }];
    state.debugWorkers = listR.ok ? (await listR.json()).workers : [{ error: `code/list ${listR.status}` }];
  } catch (e) {
    state.obsSources = [{ error: String(e.message || e) }];
    state.debugWorkers = null;
  }
  if (state.tab === 'settings') render();
}

async function previewWorker(name) {
  state.debugWorkerPreview = { loading: true, name };
  render();
  try {
    const r = await fetch(`${BRIDGE}/code/${encodeURIComponent(name)}`, { headers: operatorHeaders() });
    const d = await r.json();
    state.debugWorkerPreview = { name, ok: r.ok, preview: d.preview || d.error || JSON.stringify(d) };
  } catch (e) {
    state.debugWorkerPreview = { name, ok: false, preview: String(e.message || e) };
  }
  render();
}

/* ─────────────────────────────────────────────────────
   BRIDGE DRAWER
   ───────────────────────────────────────────────────── */
function renderBridge() {
  const msgs = state.bridgeMsgs.map(m => {
    const cls = m.role === 'system' ? 'system' : m.role === 'user' ? 'user' : 'assistant';
    const author = m.role === 'system' ? '' : m.role === 'user' ? 'You' : 'The Bridge';
    return `<div class="bmsg ${cls}">${author ? `<div class="bauth">${author}</div>` : ''}${escapeHtml(m.text)}</div>`;
  }).join('');
  $('bridgeMsgs').innerHTML = msgs;
  $('bridgeMsgs').scrollTop = $('bridgeMsgs').scrollHeight;
  $('bridgeQuick').innerHTML = [
    'My next 3 highest-impact actions',
    'Why are 5 services down?',
    'Wire ai-hub into observatory',
    'Audit candidates to retire',
    'Deploy Colyseus on Windows VPS',
  ].map(q => `<button class="bchip" onclick="askBridge('${q.replace(/'/g, "\\'")}')">${q}</button>`).join('');
  $('bridgeInput').disabled = state.bridgeBusy;
  $('bridgeSend').disabled = state.bridgeBusy;
  $('bridgeSend').textContent = state.bridgeBusy ? '…' : 'Send';
}

/* ─────────────────────────────────────────────────────
   GLOBAL ACTIONS
   ───────────────────────────────────────────────────── */
function setTab(tab, sourceFilter) {
  state.tab = tab;
  if (tab === 'logs' && sourceFilter) state.logFilter.source = sourceFilter;
  document.querySelectorAll('.sb-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  render();
}
function askBridge(q) {
  if (!state.bridgeOpen) toggleBridge();
  bridgeChat(q);
}
function toggleBridge() {
  state.bridgeOpen = !state.bridgeOpen;
  $('bridge').classList.toggle('collapsed', !state.bridgeOpen);
  $('bridgeToggleBtn').textContent = state.bridgeOpen ? '▼' : '▲';
}

window.setTab = setTab; window.askBridge = askBridge; window.selectVessel = selectVessel;
window.closeInsp = closeInsp; window.lookupAccount = lookupAccount; window.loadDemoAccount = loadDemoAccount;
window.mapZoom = mapZoom; window.mapCenter = mapCenter; window.pollHealth = pollHealth;
window.startBridgeLiveStream = startBridgeLiveStream;
window.saveAdminKey = saveAdminKey; window.loadDebugPanels = loadDebugPanels; window.previewWorker = previewWorker;

/* ─────────────────────────────────────────────────────
   HOOKS + INIT
   ───────────────────────────────────────────────────── */
document.querySelectorAll('.sb-btn').forEach(btn => {
  btn.addEventListener('click', () => setTab(btn.dataset.tab));
});
$('btnRefresh').addEventListener('click', () => pollHealth());
$('bridgeBar').addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') return; });
$('bridgeToggleBtn').addEventListener('click', toggleBridge);
$('bridgeSend').addEventListener('click', () => {
  const v = $('bridgeInput').value.trim();
  if (!v) return;
  $('bridgeInput').value = '';
  bridgeChat(v);
});
$('bridgeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('bridgeSend').click(); }
});

function tickClock() { $('clock').textContent = new Date().toISOString().slice(11, 19) + ' UTC'; }
setInterval(tickClock, 1000); tickClock();

initPuterAuth().then(async authed => {
  if (!authed) return;
  const savedTok = sessionStorage.getItem('gs_grudge_token');
  if (savedTok) state.grudgeToken = savedTok;
  if (state.puterUser && !state.grudgeToken) await exchangeGrudgeToken(state.puterUser);
  render();
  renderBridge();
  pollHealth();
  startBridgeLiveStream();
  pollObservatory();
  pollBridgeContext();
  loadIdentityStats();
  setInterval(pollHealth, 30000);
  setInterval(pollObservatory, 60000);
  setInterval(pollBridgeContext, 60000);
});
